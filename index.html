<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ぱにっく100！DX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { background: linear-gradient(135deg, #fff9c4 0%, #ffc1e3 50%, #b3e5fc 100%); color: #374151; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; font-family: 'Arial Black', sans-serif; touch-action: manipulation; margin: 0; transition: background 0.6s ease; }
        #stadium-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .player-orbit { position: absolute; min-width: 90px; height: 45px; transition: all 0.5s; z-index: 50; display: flex; align-items: center; justify-content: center; }
        .orbit-arrow { position: absolute; font-size: 34px; color: #ea580c; transition: all 0.5s; z-index: 30; pointer-events: none; text-shadow: -1px -1px 0 white, 1px -1px 0 white, -1px 1px 0 white, 1px 1px 0 white, 2px 2px 5px rgba(0,0,0,0.4); }
        .card-container { position: relative; flex-shrink: 0; padding: 5px; }
        .card-base { border: 4px solid white; border-radius: 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; transition: all 0.2s ease-out; box-shadow: 0 6px 15px rgba(0,0,0,0.2); white-space: nowrap; color: white !important; font-size: 1.8rem; text-shadow: 2px 2px 0px rgba(0,0,0,0.3); overflow: hidden; }
        .card-active { transform: translateY(-25px) scale(1.1); border: 6px solid #fbbf24 !important; z-index: 1500; box-shadow: 0 30px 50px rgba(0,0,0,0.4); }
        .card-num-plus { background: #3b82f6 !important; }
        .card-num-minus { background: #ef4444 !important; }
        .card-event { background: #facc15 !important; color: #1e293b !important; text-shadow: none !important; }
        .card-rare { font-size: 1.1rem; }
        .rare-band { position: absolute; left: 0; right: 0; height: 18px; background: rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 7px; font-weight: 900; letter-spacing: 0.1em; color: white; z-index: 5; }
        .band-top { top: 0; border-bottom: 2px solid white; }
        .band-bottom { bottom: 0; border-top: 2px solid white; }
        .card-brink { background: linear-gradient(135deg, #f97316, #ef4444) !important; }
        .card-bomb { background: linear-gradient(135deg, #1e293b, #450a0a) !important; }
        .card-tanyao { background: linear-gradient(135deg, #10b981, #064e3b) !important; }
        .card-bag { background: linear-gradient(135deg, #f59e0b, #78350f) !important; }
        .card-sleep { background: linear-gradient(135deg, #6366f1, #312e81) !important; }
        .card-crazy { background: linear-gradient(135deg, #ec4899, #831843) !important; }
        .shine-effect::after { content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(45deg, transparent, rgba(255,255,255,0.6), transparent); transform: rotate(45deg); animation: cardShine 3s infinite; z-index: 20; pointer-events: none; }
        @keyframes cardShine { 0% { transform: translate(-100%, -100%) rotate(45deg); } 100% { transform: translate(100%, 100%) rotate(45deg); } }
        @keyframes bombBeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
        .bomb-pulsing { animation: bombBeat 0.5s infinite; filter: drop-shadow(0 0 20px red); }
        #vfx-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 5000 !important; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; }
        .vfx-active { opacity: 1 !important; }
        .vfx-content {
            font-size: 8rem; filter: drop-shadow(0 0 40px rgba(0,0,0,0.5)); transform: scale(0); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background-color: rgba(255, 251, 235, 0.95); padding: 2.5rem 4rem; border-radius: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }
        .vfx-active .vfx-content { transform: scale(1); }
        .field-card-anim { animation: cardEnter 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes cardEnter { 0% { opacity: 0; transform: scale(2.5) rotate(-15deg); } 100% { opacity: 1; transform: scale(1.0) rotate(0); } }
        .new-badge { position: absolute; top: -5px; right: -10px; background: #ef4444; color: white; font-size: 9px; padding: 2px 8px; border-radius: 20px; border: 2px solid white; z-index: 1600; font-weight: 900; animation: pulse 1s infinite; pointer-events: none; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        body.vfx-active-bg { background-image: none !important; }
        .bg-vfx-brink { background-color: #ffdbbb !important; }
        .bg-vfx-bomb { background-color: #fca5a5 !important; }
        .bg-vfx-sleep { background-color: #c7d2fe !important; }
        .bg-vfx-bag { background-color: #fde68a !important; }
        .bg-vfx-tanyao { background-color: #a7f3d0 !important; }
        .bg-vfx-crazy { background-color: #fbcfe8 !important; }
        .bg-danger { background-color: #dc2626 !important; }
    </style>
</head>
<body>

    <div id="vfx-overlay"><div id="vfx-item" class="vfx-content"></div></div>
    <audio id="se-play" src="https://actions.google.com/config/audio/g_regular_opening.mp3"></audio>
    <audio id="se-bomb" src="https://actions.google.com/config/audio/explosion.mp3"></audio>
    <audio id="bgm-battle" loop src="https://cdn.pixabay.com/audio/2022/03/10/audio_c33ca4523a.mp3"></audio>

    <div id="setup-screen" class="fixed inset-0 z-[3000] bg-gradient-to-br from-yellow-50 to-orange-100 flex items-center justify-center p-4">
        <div id="login-box" class="bg-white p-8 rounded-[3.5rem] border-8 border-yellow-300 w-full max-w-sm shadow-[0_15px_0_#fde047]">
            <h1 class="text-4xl font-black text-yellow-500 mb-6 italic uppercase text-center">ぱにっく100！</h1>
            <input id="room-id" type="text" placeholder="部屋の合言葉" class="w-full bg-yellow-50 p-4 rounded-2xl mb-4 border-4 border-yellow-200 text-center font-black outline-none text-lg text-center">
            <input id="user-name" type="text" placeholder="あなたの名前" class="w-full bg-yellow-50 p-4 rounded-2xl mb-8 border-4 border-yellow-200 text-center font-black outline-none text-lg text-center">
            <button onclick="joinRoom()" class="w-full bg-gradient-to-b from-orange-400 to-red-500 text-white font-black py-5 rounded-3xl shadow-xl text-2xl uppercase italic">Entry!</button>
        </div>
        <div id="lobby-box" class="hidden bg-white p-8 rounded-[4rem] border-8 border-blue-300 w-full max-w-sm text-center shadow-[0_15px_0_#93c5fd]">
            <h2 class="text-3xl font-black mb-6 text-blue-500 uppercase italic">Lobby</h2>
            <div id="member-list" class="space-y-3 mb-8 text-left p-2 max-h-60 overflow-y-auto"></div>
            <div id="host-controls" class="hidden"><button onclick="startGame()" class="w-full bg-gradient-to-b from-blue-400 to-indigo-600 text-white font-black py-5 rounded-3xl text-2xl uppercase italic">Start!</button></div>
            <div id="guest-waiting" class="text-blue-300 animate-pulse font-black text-sm uppercase">Waiting for host...</div>
        </div>
    </div>

    <div id="game-screen" class="hidden flex-1 flex flex-col relative h-full">
        <div class="pt-2 p-2 shrink-0 z-[100]">
            <button onclick="toggleRules()" class="fixed top-16 right-4 z-[150] bg-white w-10 h-10 rounded-full shadow-lg font-black text-pink-500 border-4 border-pink-100 text-xl active:scale-90">？</button>
            <div class="flex items-center justify-between px-2">
                <span id="total-display" class="text-3xl font-black text-blue-600 italic tracking-tighter">0 / 100</span>
                <div class="flex-1 ml-4 h-4 bg-white/60 rounded-full border-2 border-white p-0.5 shadow-inner overflow-hidden">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-cyan-400 to-blue-600 rounded-full transition-all duration-1000"></div>
                </div>
            </div>
        </div>

        <div id="battle-field" class="flex-1 relative overflow-hidden min-h-0">
            <div id="stadium-container">
                <div id="player-ring" class="absolute inset-0 pointer-events-none"></div>
                <div id="arrow-ring" class="absolute inset-0 pointer-events-none"></div>
                <div id="field-card-container" class="z-10 flex flex-col items-center justify-center relative">
                    <div id="last-card"></div>
                </div>
            </div>
        </div>

        <div class="flex justify-center z-[110] mb-0 p-0">
            <div id="turn-announcer-horiz" class="text-[9px] font-black text-pink-600 bg-white/95 px-4 py-1 rounded-t-lg border-2 border-b-0 border-pink-200 uppercase italic"></div>
        </div>

        <div class="flex z-[110] border-2 border-b-0 border-slate-200 bg-white shadow-sm overflow-hidden">
            <button onclick="changeTab('all')" id="tab-all" class="flex-1 py-2 font-black text-[10px] border-r-2 border-slate-200 uppercase relative">ALL</button>
            <button onclick="changeTab('num')" id="tab-num" class="flex-1 py-2 font-black text-[10px] border-r-2 border-slate-200 uppercase relative">すうじ</button>
            <button onclick="changeTab('event')" id="tab-event" class="flex-1 py-2 font-black text-[10px] border-r-2 border-slate-200 uppercase relative">イベント</button>
            <button onclick="changeTab('rare')" id="tab-rare" class="flex-1 py-2 font-black text-[10px] uppercase relative">レア</button>
        </div>

        <div id="hand-wrapper" class="h-[170px] shrink-0 bg-white/50 border-t-2 border-white/80 z-[1000] flex items-center">
            <div id="my-hand" class="flex gap-4 px-6 overflow-x-auto no-scrollbar scroll-smooth items-center h-full w-full relative"></div>
        </div>

        <div id="action-panel" class="fixed bottom-0 left-0 right-0 bg-white border-t-8 border-yellow-300 p-6 pb-12 shadow-2xl z-[3000] translate-y-full transition-transform duration-500 rounded-t-[4rem]">
            <div class="flex justify-between items-start mb-6">
                <div><h3 id="selected-card-name" class="text-3xl font-black italic uppercase">CARD</h3><p id="selected-card-desc" class="text-[11px] text-slate-500 mt-1 font-bold"></p></div>
                <button onclick="deselectCard()" class="bg-slate-100 w-12 h-12 rounded-full flex items-center justify-center text-slate-400 font-bold text-xl">✕</button>
            </div>
            <div id="target-selector" class="hidden mb-6"><div id="target-list" class="flex gap-3 overflow-x-auto no-scrollbar py-2"></div></div>
            <div id="control-area">
                <button id="play-btn" onclick="executePlay()" class="w-full bg-gradient-to-r from-yellow-400 to-orange-500 text-white font-black py-5 rounded-[2.5rem] text-2xl shadow-xl italic uppercase hidden">Play Card!</button>
                <div id="not-my-turn-msg" class="text-center text-slate-300 text-xs font-black py-6 uppercase italic">Wait for turn</div>
            </div>
        </div>
    </div>

    <div id="rules-modal" class="fixed inset-0 bg-black/85 hidden flex items-center justify-center z-[7000] p-6" onclick="toggleRules()">
        <div class="bg-white p-8 rounded-[3.5rem] max-w-sm w-full shadow-2xl text-slate-700 max-h-[80vh] overflow-y-auto" onclick="event.stopPropagation()">
            <h2 class="text-2xl font-black text-pink-500 mb-6 italic uppercase text-center">Rule Book</h2>
            <div class="text-[12px] font-bold space-y-4 text-left">
                <p>● <span class="text-red-500 font-black">100</span>以上で敗北！</p>
                <p>● 手札が4枚以下の時、自動的に5枚まで補充！</p>
                <hr>
                <h3 class="text-center text-orange-400 font-black uppercase">RARE CARDS</h3>
                <ul class="list-disc pl-4 space-y-2">
                    <li><span class="text-orange-600 font-black">セトギワ</span>：カウントを99にする！</li>
                    <li><span class="text-red-500 font-black">BOMB</span>：相手に爆弾！30%で爆死。</li>
                    <li><span class="text-blue-600 font-black">タンヤオ</span>：2～8以外全破棄！</li>
                    <li><span class="text-green-600 font-black">フクブクロ</span>：数字を一気に7枚ドロー！</li>
                    <li><span class="text-indigo-600 font-black">トウミン</span>：2ターン番を回避！</li>
                    <li><span class="text-pink-600 font-black">ケタハズレ</span>：全員に巨大数字を3枚贈呈！</li>
                </ul>
            </div>
            <button onclick="toggleRules()" class="w-full mt-8 bg-pink-500 text-white font-black py-4 rounded-2xl shadow-xl uppercase">OK</button>
        </div>
    </div>

    <div id="finish-modal" class="fixed inset-0 bg-black/85 hidden flex items-center justify-center z-[6000] p-6 text-center text-white">
        <div class="bg-white p-10 rounded-[4rem] border-[10px] border-pink-500 shadow-2xl max-w-sm w-full text-slate-800">
            <h2 class="text-4xl font-black mb-2 italic uppercase text-pink-600">Finish!</h2>
            <p id="loser-text" class="text-xl mb-10 text-slate-600 font-black"></p>
            <button id="back-lobby-btn" onclick="backToLobby()" class="w-full bg-blue-500 text-white font-black py-5 rounded-2xl text-lg shadow-lg uppercase italic">Lobby</button>
        </div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyB0K9MQEuEYQghAUiLyjUWzqk32x9fznwY", authDomain: "pamimi-cbb93.firebaseapp.com",
        databaseURL: "https://pamimi-cbb93-default-rtdb.firebaseio.com", projectId: "pamimi-cbb93",
        storageBucket: "pamimi-cbb93.firebasestorage.app", messagingSenderId: "590109121218",
        appId: "1:590109121218:web:60569644ed2b291bea395b", measurementId: "G-GHLZSQF85W"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let myName = "", roomPath = "", gameState = null, selectedIdx = -1, lastCardID = "", targetName = "", currentTab = "all", isJoinedFlag = false, isVFXRunning = false, lastProcessedVFX = "", lastProcessedSuspenseTurn = -1, isSuspenseActive = false;

    const ICONS = { 'num': '', 'skip': '⏩', 'rev': '↺', 'draw2': '🃏🃏', 'calc': '🧮', 'brink': '⚡🔥', 'bomb': '💣🧨', 'bag': '💰👜', 'sleep': '💤🛌', 'crazy': '🚀💥', 'tanyao': '🀝' };
    const DESC = { 'num': 'カウント変化。', 'skip': '飛ばす！', 'rev': '逆転！', 'draw2': '2枚引く！', 'calc': '計算！', 'brink': '99固定！', 'bomb': '相手に爆弾！', 'bag': '数字7枚！', 'sleep': '2ターン休み。', 'crazy': '3枚の死。', 'tanyao': '2-8以外廃棄！' };
    const VFX_BG = { bomb: 'bg-vfx-bomb', brink: 'bg-vfx-brink', sleep: 'bg-vfx-sleep', bag: 'bg-vfx-bag', tanyao: 'bg-vfx-tanyao', crazy: 'bg-vfx-crazy' };

    // 【修正】toggleRulesをrules-modalに繋ぎ直したよ！
    function toggleRules() { document.getElementById('rules-modal').classList.toggle('hidden'); }

    async function joinRoom() {
        const rI = document.getElementById('room-id').value.trim().toLowerCase();
        const nI = document.getElementById('user-name').value.trim();
        if (!rI || !nI) return alert("名前と合言葉を入れてね！");
        myName = nI; roomPath = `panic100_frontier_v116/${rI}`; isJoinedFlag = true;
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('lobby-box').classList.remove('hidden');
        try {
            const snap = await db.ref(roomPath).get();
            let d = snap.val();
            if (!d) d = { hostName: myName, players: [{ name: myName, hand: generateHand(7), hibernation: 0 }], started: false, total: 0, currentIndex: 0, direction: 1, lastPlayed: null, turnCount: 0, suspense: null, gameOver: false };
            else if (!d.players.find(p => p.name === myName)) {
                if (d.started) return alert("進行中！"); d.players.push({ name: myName, hand: generateHand(7), hibernation: 0 });
            }
            await db.ref(roomPath).set(d);
            db.ref(roomPath).on('value', s => { gameState = s.val(); render(); });
        } catch (e) { isJoinedFlag = false; render(); }
    }

    function triggerVFX(symbol, animateClass = "", bgClass = "") {
        if (isVFXRunning) return Promise.resolve(); isVFXRunning = true;
        const overlay = document.getElementById('vfx-overlay'); const item = document.getElementById('vfx-item');
        item.innerHTML = symbol; item.className = "vfx-content " + (animateClass || "");
        if(bgClass) { document.body.classList.add(bgClass); document.body.classList.add('vfx-active-bg'); }
        overlay.classList.add('vfx-active'); 
        return new Promise(res => setTimeout(() => { overlay.classList.remove('vfx-active'); if(bgClass) { document.body.classList.remove(bgClass); document.body.classList.remove('vfx-active-bg'); } isVFXRunning = false; render(); res(); }, 2200)); 
    }

    async function checkBombExplosion() {
        if (!gameState || isVFXRunning || isSuspenseActive || gameState.gameOver) return;
        const curP = gameState.players[gameState.currentIndex];
        if (curP && curP.name === myName && lastProcessedSuspenseTurn !== gameState.turnCount && curP.hand.some(c => c.name.includes("💣"))) {
            lastProcessedSuspenseTurn = gameState.turnCount;
            await db.ref(roomPath + "/suspense").set({ active: true, player: myName, turn: gameState.turnCount });
            isSuspenseActive = true; render();
            await triggerVFX('💣', 'bomb-pulsing', 'bg-vfx-bomb');
            if (Math.random() < 0.30) {
                await db.ref(roomPath + "/suspense").set({ active: true, player: myName, result: 'OUT', turn: gameState.turnCount });
                await triggerVFX(`<div class="text-black font-black text-6xl">${myName}<br>OUT!</div>`, '', 'bg-danger');
                try { document.getElementById('se-bomb').play(); } catch(e){}
                let updatedHand = curP.hand.filter(c => !c.name.includes("💣"));
                updatedHand = updatedHand.map(c => (c.type === 'num') ? { ...c, name: "100", value: 100 } : c);
                while(updatedHand.length < 5) updatedHand.push({ name: "100", type: 'num', value: 100, isNew: true });
                await db.ref(roomPath + "/players/" + gameState.currentIndex + "/hand").set(updatedHand);
            } else {
                await db.ref(roomPath + "/suspense").set({ active: true, player: myName, result: 'SAFE', turn: gameState.turnCount });
                await triggerVFX(`<div class="text-black font-black text-6xl">${myName}<br>SAFE!</div>`, '', 'bg-vfx-sleep');
            }
            await db.ref(roomPath + "/suspense").set(null);
            isSuspenseActive = false; render();
        }
    }

    function makeCard(isNew = false) {
        const r = Math.random();
        let card;
        if (r < 0.40) card = { name: '+' + (Math.floor(Math.random() * 20) + 1), type: 'num' };
        else if (r < 0.65) card = { name: '-' + (Math.floor(Math.random() * 20) + 1), type: 'num' };
        else if (r < 0.85) {
            const evs = [{ name: 'SKIP', type: 'skip' }, { name: 'REVERSE', type: 'rev' }, { name: 'DRAW 2', type: 'draw2' }, { name: '× 2', type: 'calc' }, { name: '÷ 2', type: 'calc' }];
            card = { ...evs[Math.floor(Math.random() * evs.length)], isEvent: true };
        } else {
            const rs = [{ name: 'セトギワ', type: 'brink' }, { name: 'BOMB', type: 'bomb' }, { name: 'タンヤオ', type: 'tanyao' }, { name: 'フクブクロ', type: 'bag' }, { name: 'トウミン', type: 'sleep' }, { name: 'ケタハズレ', type: 'crazy' }];
            card = { ...rs[Math.floor(Math.random() * rs.length)], isRare: true };
        }
        if (isNew) { card.isNew = true; card.age = 0; } return card;
    }
    function generateHand(c) { return Array.from({length: c}, () => makeCard()); }
    function shuffleArray(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } return array; }
    function changeTab(tab) { currentTab = tab; render(); }
    function filterAndSortHand(hand) { if (!hand) return []; return hand.filter(c => (currentTab === 'all' || (currentTab === 'num' && c.type === 'num' && !c.isEvent && !c.isRare) || (currentTab === 'event' && (c.isEvent || c.type === 'bomb')) || (currentTab === 'rare' && c.isRare))).sort((a, b) => (a.type === 'num' && b.type === 'num') ? parseInt(a.name) - parseInt(b.name) : (a.type || '').localeCompare(b.type || '')); }

    function render() {
        if (!isJoinedFlag || !gameState) return;
        if (gameState.gameOver) { document.getElementById('loser-text').innerText = `${gameState.loser} が爆死！\nTotal: ${gameState.total}`; document.getElementById('finish-modal').classList.remove('hidden'); }
        else { document.getElementById('finish-modal').classList.add('hidden'); }

        if (!gameState.started) {
            document.getElementById('setup-screen').classList.remove('hidden'); document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('member-list').innerHTML = gameState.players.map(p => `<div class="p-4 bg-white rounded-2xl border-4 border-slate-100 font-black text-sm flex items-center justify-between shadow-sm"><span>${p.name}</span>${p.name===gameState.hostName?'<span class="bg-yellow-400 text-white px-2 py-0.5 rounded-full text-[8px]">HOST</span>':''}</div>`).join('');
            document.getElementById('host-controls').classList.toggle('hidden', gameState.hostName !== myName); 
            document.getElementById('last-card').innerHTML = ""; 
            lastCardID = ""; 
            return;
        }

        document.getElementById('setup-screen').classList.add('hidden'); document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('total-display').innerText = `${gameState.total} / 100`;
        document.getElementById('progress-bar').style.width = `${Math.min(100, gameState.total)}%`;
        
        const last = gameState.lastPlayed;
        if (last && lastProcessedVFX !== last.id) {
            lastProcessedVFX = last.id; const c = last.card;
            if(c.type === 'bomb') triggerVFX('💣🧨', '', VFX_BG.bomb); else if(c.type === 'brink') triggerVFX('⚡🔥', '', VFX_BG.brink); else if(c.type === 'sleep') triggerVFX('💤🛌', '', VFX_BG.sleep); else if(c.type === 'bag') triggerVFX('💰👜', '', VFX_BG.bag); else if(c.type === 'tanyao') triggerVFX('<div class="flex text-4xl bg-white p-4 rounded-xl border-4 border-green-600 shadow-xl font-normal">🀚🀛🀜🀈🀉🀊</div>', '', VFX_BG.tanyao); else if(c.type === 'crazy') triggerVFX('🚀💥', '', VFX_BG.crazy); else if(c.type === 'skip') triggerVFX('⏩'); else if(c.type === 'rev') triggerVFX('🔄'); else if(c.type === 'draw2') triggerVFX('🃏🃏');
            try { document.getElementById('se-play').play().catch(()=>{}); } catch(e){}
        }

        const susp = gameState.suspense;
        if (susp && susp.active && lastProcessedSuspenseTurn !== susp.turn) {
            if (susp.result) { 
                lastProcessedSuspenseTurn = susp.turn; 
                if (susp.result === 'OUT') triggerVFX(`<div class="text-black font-black text-6xl">${susp.player}<br>OUT!</div>`, '', 'bg-danger'); 
                else if (susp.result === 'SAFE') triggerVFX(`<div class="text-black font-black text-6xl">${susp.player}<br>SAFE!</div>`, '', 'bg-vfx-sleep'); 
            }
            else if (myName !== susp.player) { triggerVFX('💣', 'bomb-pulsing', 'bg-vfx-bomb'); }
        }

        if(!isVFXRunning && !isSuspenseActive) checkBombExplosion();

        if (last && lastCardID !== last.id) {
            const fs = (last.card.isRare || last.card.name.toString().length >= 6) ? '1.1rem' : '1.8rem';
            let isActuallyRare = last.card.isRare && last.card.name !== "💣🧨";
            let sc = isActuallyRare ? `card-${last.card.type} shine-effect` : (last.card.isEvent ? 'card-event' : (last.card.name.includes('+') ? 'card-num-plus' : 'card-num-minus'));
            const bands = isActuallyRare ? '<div class="rare-band band-top">RARE</div><div class="rare-band band-bottom">RARE</div>' : '';
            const icon = (last.card.isRare || last.card.type === 'bomb') ? `<div class="text-3xl mb-1 font-normal">${ICONS[last.card.type]}</div>` : '';
            document.getElementById('last-card').innerHTML = `<div class="card-base ${sc} field-card-anim w-28 h-40 font-black shadow-xl border-b-8" style="font-size: ${fs};">${bands}${icon}${last.card.name}<div class="text-[8px] mt-4 opacity-70 font-black text-center">${last.player}</div></div>`;
            lastCardID = last.id;
        } else if (!last) {
            document.getElementById('last-card').innerHTML = "";
            lastCardID = "";
        }

        const ring = document.getElementById('player-ring'); const arrows = document.getElementById('arrow-ring'); const cX = ring.clientWidth / 2; const cY = ring.clientHeight / 2; const rX = cX * 0.75; const rY = cY * 0.78; const curP = gameState.players[gameState.currentIndex]; const isT = (curP && curP.name.trim() === myName.trim());
        document.getElementById('turn-announcer-horiz').innerText = `NOW: ${curP ? curP.name : ''}'s TURN`;
        document.getElementById('play-btn').classList.toggle('hidden', !isT || isSuspenseActive || isVFXRunning); document.getElementById('not-my-turn-msg').classList.toggle('hidden', isT);
        arrows.innerHTML = gameState.players.map((p, i) => { const ang = (i * (360 / gameState.players.length) - 90) * (Math.PI / 180); const nAng = ((i + gameState.direction + gameState.players.length) % gameState.players.length * (360 / gameState.players.length) - 90) * (Math.PI / 180); let midAng = (ang + nAng) / 2; if (Math.abs(nAng - ang) > Math.PI) midAng += Math.PI; const rot = (midAng * 180 / Math.PI) + (gameState.direction > 0 ? 90 : 270); return `<div class="orbit-arrow" style="left:${cX + rX * 0.94 * Math.cos(midAng) - 15}px; top:${cY + rY * 0.94 * Math.sin(midAng) - 15}px; transform: rotate(${rot}deg);">➔</div>`; }).join('');
        ring.innerHTML = gameState.players.map((p, i) => { const ang = (i * (360 / gameState.players.length) - 90) * (Math.PI / 180); const isC = (i === gameState.currentIndex); const hasBomb = p.hand && p.hand.some(c => c.name.includes("💣")); return `<div class="player-orbit" style="left: ${cX + rX * Math.cos(ang) - 45}px; top: ${cY + rY * Math.sin(ang) - 22}px;"><div class="w-full h-full rounded-2xl flex items-center justify-center font-black border-4 ${isC ? 'border-yellow-400 bg-white scale-110 shadow-lg' : 'border-slate-300 bg-white/80 text-slate-700'}"><span class="text-[10px] truncate px-2">${p.name}</span></div><div class="absolute inset-0 pointer-events-none">${p.hibernation > 0 ? `<div class="absolute -bottom-2 -left-4 bg-white text-blue-600 rounded-full w-9 h-9 flex flex-col items-center justify-center text-[8px] shadow-lg border-2 border-blue-400 font-black">💤<span>${p.hibernation}T</span></div>` : ''}${hasBomb ? `<div class="absolute -top-2 -right-4 bg-slate-800 rounded-full w-8 h-8 flex items-center justify-center text-lg shadow-lg bomb-pulse border-2 border-white">💣</div>` : ''}</div></div>`; }).join('');
        const myD = gameState.players.find(p => p.name.trim() === myName.trim());
        if (myD && myD.hand) { ["all", "num", "event", "rare"].forEach(tab => { const el = document.getElementById(`tab-${tab}`); const hasNew = myD.hand.some(c => c.isNew && (tab === 'all' || (tab === 'num' && c.type === 'num' && !c.isEvent) || (tab === 'event' && (c.isEvent || c.type === 'bomb')) || (tab === 'rare' && c.isRare))); el.innerHTML = `${{all:'ALL',num:'すうじ',event:'イベント',rare:'レア'}[tab]}${hasNew ? '<span class="absolute top-0.7 right-1 w-1.5 h-1.5 bg-red-500 rounded-full"></span>' : ''}`; }); const sh = filterAndSortHand(myD.hand); document.getElementById('my-hand').innerHTML = sh.map((c, i) => { const fs = (c.isRare || c.name.toString().length >= 6) ? '0.85rem' : '1.5rem'; let isActuallyRare = c.isRare && c.name !== "💣🧨"; let st = (isActuallyRare || c.name.includes("💣")) ? `card-${c.type} shine-effect` : (c.isEvent ? 'card-event' : (c.name.includes('+') ? 'card-num-plus' : 'card-num-minus')); const bands = isActuallyRare ? '<div class="rare-band band-top">RARE</div><div class="rare-band band-bottom">RARE</div>' : ''; const icon = (c.isRare || c.type === 'bomb') ? `<div class="text-3xl mb-1 font-normal">${ICONS[c.type]}</div>` : ''; return `<div class="card-container"><button onclick="selectCard(${i})" class="card-base ${st} w-24 h-36 font-black shadow-lg shrink-0 ${selectedIdx===i?'card-active':''}" style="font-size: ${fs};">${bands}${icon}${c.name}</button>${c.isNew ? '<span class="new-badge">New</span>' : ''}</div>`; }).join(''); }
    }
    function selectCard(i) { if (isVFXRunning || isSuspenseActive) return; selectedIdx = i; const myD = gameState.players.find(p => p.name.trim() === myName.trim()); const card = filterAndSortHand(myD.hand)[i]; document.getElementById('selected-card-name').innerText = card.name; document.getElementById('selected-card-desc').innerText = DESC[card.type] || 'CARD'; const tSel = document.getElementById('target-selector');
        if (card.type === 'bomb') { tSel.classList.remove('hidden'); document.getElementById('target-list').innerHTML = gameState.players.filter(p => p.name !== myName).map(p => `<button onclick="targetName='${p.name}';selectCard(${i})" class="px-5 py-2 rounded-xl font-black ${targetName===p.name?'bg-pink-500 text-white':'bg-white text-slate-500 border-2'}">${p.name}</button>`).join(''); }
        else { tSel.classList.add('hidden'); targetName = ""; }
        document.getElementById('action-panel').classList.remove('translate-y-full'); render(); }
    function deselectCard() { selectedIdx = -1; targetName = ""; document.getElementById('action-panel').classList.add('translate-y-full'); render(); }
    function startGame() { db.ref(roomPath).update({ started: true, players: shuffleArray([...gameState.players]), total: 0, currentIndex: 0, direction: 1, turnCount: 0, suspense: null, gameOver: false, lastPlayed: null }); }
    async function backToLobby() { const rPs = gameState.players.map(p => ({ name: p.name, hand: generateHand(7), hibernation: 0 })); await db.ref(roomPath).update({ started: false, gameOver: false, players: rPs, total: 0, currentIndex: 0, lastPlayed: null, turnCount: 0, suspense: null }); }
    function executePlay() { const curP = gameState.players[gameState.currentIndex]; if (curP.name !== myName) return; const sh = filterAndSortHand(curP.hand); const card = sh[selectedIdx]; if (card.type === 'bomb' && !targetName) return alert("ターゲットを選んで！"); playCard(curP.hand.findIndex(c => c === card)); deselectCard(); }
    function playCard(idx) { const curP = gameState.players[gameState.currentIndex]; const card = curP.hand.splice(idx, 1)[0]; let nT = gameState.total;
        if (card.type === 'num') nT += parseInt(card.name); else if (card.type === 'calc') nT = card.name.includes('×') ? nT * 2 : Math.floor(nT / 2); else if (card.type === 'brink') nT = 99;
        else if (card.type === 'bag') { for(let i=0; i<7; i++) { const v = Math.floor(Math.random()*20)+1; const s = Math.random()<0.5?'+':'-'; curP.hand.push({name:s+v,type:'num',isNew:true}); }} else if (card.type === 'sleep') curP.hibernation = 2; 
        else if (card.type === 'tanyao') gameState.players.forEach(p => p.hand = p.hand.filter(c => ((c.type === 'num' && Math.abs(parseInt(c.name)) >= 2 && Math.abs(parseInt(c.name)) <= 8) || c.isEvent || c.isRare) && c.type !== 'bomb'));
        else if (card.type === 'crazy') gameState.players.forEach(p => { if(p.name !== myName) for(let k=0; k<3; k++) p.hand.push({name: '2147483647', type:'num',isNew:true}); });
        else if (card.type === 'bomb') { const t = gameState.players.find(p => p.name === targetName); if(t) t.hand.push({ name: "💣🧨", type:'bomb', isNew:true, isEvent: true }); }
        let step = card.type === 'skip' ? 2 : 1;
        if (card.type === 'rev') gameState.direction *= -1; else if (card.type === 'draw2') for(let i=0; i<2; i++) curP.hand.push(makeCard(true));
        gameState.players.forEach(p => { p.hand.forEach(c => { if(c.isNew) { c.age = (c.age || 0) + 1; if(c.age > 1) delete c.isNew; } }); while(p.hand.length < 5) p.hand.push(makeCard(true)); }); nT = Math.max(0, nT); let nIdx = (gameState.currentIndex + gameState.direction * step + gameState.players.length) % gameState.players.length; while(gameState.players[nIdx].hibernation > 0) { gameState.players[nIdx].hibernation--; nIdx = (nIdx + gameState.direction + gameState.players.length) % gameState.players.length; } db.ref(roomPath).update({ total: nT, currentIndex: nIdx, direction: gameState.direction, players: gameState.players, lastPlayed: { card, player: myName, id: Date.now() }, turnCount: gameState.turnCount + 1, gameOver: nT >= 100, loser: nT >= 100 ? myName : null });
    }
</script>
