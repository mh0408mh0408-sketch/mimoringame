<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ぱにっく100！DX</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffc1e3">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { background: linear-gradient(135deg, #fff9c4 0%, #ffc1e3 50%, #b3e5fc 100%); color: #374151; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; font-family: 'Arial Black', sans-serif; touch-action: manipulation; margin: 0; transition: background 0.6s ease; padding-top: env(safe-area-inset-top); }
        #stadium-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .player-orbit { position: absolute; min-width: 90px; height: 45px; transition: all 0.5s; z-index: 50; display: flex; align-items: center; justify-content: center; }
        .orbit-arrow { position: absolute; font-size: 34px; color: #ea580c; transition: all 0.5s; z-index: 30; pointer-events: none; text-shadow: -1px -1px 0 white, 1px -1px 0 white, -1px 1px 0 white, 1px 1px 0 white, 2px 2px 5px rgba(0,0,0,0.4); }
        .card-container { position: relative; flex-shrink: 0; padding: 5px; }
        .card-base { border: 4px solid white; border-radius: 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; transition: all 0.2s ease-out; box-shadow: 0 6px 15px rgba(0,0,0,0.2); white-space: nowrap; color: white !important; font-size: 1.8rem; text-shadow: 2px 2px 0px rgba(0,0,0,0.3); overflow: hidden; }
        .card-active { transform: translateY(-25px) scale(1.1); border: 6px solid #fbbf24 !important; z-index: 1500; box-shadow: 0 30px 50px rgba(0,0,0,0.4); }
        
        /* 演出背景 */
        body.vfx-active-bg { background-image: none !important; }
        .bg-vfx-brink { background-color: #ffccaa !important; }
        .bg-vfx-bomb { background-color: #fca5a5 !important; }
        .bg-vfx-tanyao { background-color: #a7f3d0 !important; }
        .bg-vfx-bag { background-color: #fde68a !important; }
        .bg-vfx-sleep { background-color: #c7d2fe !important; }
        .bg-vfx-crazy { background-color: #fbcfe8 !important; }
        .bg-danger { background-color: #dc2626 !important; }

        @keyframes cardShine { 0% { transform: translate(-100%, -100%) rotate(45deg); } 100% { transform: translate(100%, 100%) rotate(45deg); } }
        @keyframes bombBeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
        .bomb-pulsing { animation: bombBeat 0.5s infinite; filter: drop-shadow(0 0 20px red); }
        #vfx-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 5000; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; }
        .vfx-active { opacity: 1 !important; }
        .vfx-content { font-size: 8rem; filter: drop-shadow(0 0 40px rgba(0,0,0,0.5)); transform: scale(0); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .new-badge { position: absolute; top: -10px; right: -10px; background: #ef4444; color: white; font-size: 9px; padding: 2px 8px; border-radius: 20px; border: 2px solid white; z-index: 1600; font-weight: 900; animation: pulse 1s infinite; pointer-events: none; }
    </style>
</head>
<body>

    <div id="vfx-overlay"><div id="vfx-item" class="vfx-content"></div></div>
    <audio id="se-play" src="https://actions.google.com/config/audio/g_regular_opening.mp3"></audio>
    <audio id="se-bomb" src="https://actions.google.com/config/audio/explosion.mp3"></audio>

    <div id="setup-screen" class="fixed inset-0 z-[3000] bg-gradient-to-br from-yellow-50 to-orange-100 flex items-center justify-center p-4">
        <div id="login-box" class="bg-white p-8 rounded-[3.5rem] border-8 border-yellow-300 w-full max-w-sm shadow-[0_20px_0_#fde047] text-center">
            <h1 class="text-4xl font-black text-yellow-500 mb-6 italic uppercase">ぱにっく100！</h1>
            <input id="room-id" type="text" placeholder="部屋の合言葉" class="w-full bg-yellow-50 p-4 rounded-2xl mb-4 border-4 border-yellow-200 text-center font-black">
            <input id="user-name" type="text" placeholder="あなたの名前" class="w-full bg-yellow-50 p-4 rounded-2xl mb-8 border-4 border-yellow-200 text-center font-black">
            <button onclick="joinRoom()" class="w-full bg-gradient-to-b from-orange-400 to-red-500 text-white font-black py-5 rounded-3xl text-2xl uppercase italic active:scale-95">Entry!</button>
        </div>
        <div id="lobby-box" class="hidden bg-white p-8 rounded-[4rem] border-8 border-blue-300 w-full max-w-sm text-center">
            <h2 class="text-3xl font-black mb-6 text-blue-500 uppercase italic">Lobby</h2>
            <div id="member-list" class="space-y-3 max-h-64 overflow-y-auto no-scrollbar mb-8 text-left"></div>
            <div id="host-controls" class="hidden"><button onclick="startGame()" class="w-full bg-gradient-to-b from-blue-400 to-indigo-600 text-white font-black py-5 rounded-3xl text-2xl uppercase italic">Battle Start!</button></div>
            <div id="guest-waiting" class="text-blue-300 animate-pulse font-black uppercase text-sm">Connecting to Arena...</div>
        </div>
    </div>

    <div id="game-screen" class="hidden flex-1 flex flex-col h-full">
        <div class="pt-8 p-4 shrink-0 z-[100]">
            <div class="flex items-center justify-between px-2">
                <span id="total-display" class="text-4xl font-black text-blue-600 italic">0 / 100</span>
                <div class="flex-1 ml-4 h-6 bg-white/60 rounded-full p-1 overflow-hidden">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-cyan-400 to-blue-600 rounded-full transition-all duration-1000"></div>
                </div>
            </div>
        </div>

        <div id="battle-field" class="flex-1 relative overflow-hidden bg-white/5">
            <div id="stadium-container">
                <div id="player-ring" class="absolute inset-0 pointer-events-none"></div>
                <div id="field-card-container" class="z-10 flex flex-col items-center justify-center">
                    <div id="last-card"></div>
                    <div id="field-placeholder" class="text-slate-300 font-black tracking-[0.5em] opacity-30 italic text-xl">CENTER</div>
                </div>
            </div>
        </div>

        <div class="px-6 py-1 shrink-0 flex justify-center z-[110]">
            <div id="turn-announcer-horiz" class="text-[10px] font-black text-pink-600 bg-white/90 px-5 py-2 rounded-full shadow-sm uppercase"></div>
        </div>

        <div id="hand-wrapper" class="h-[180px] shrink-0 bg-white/40 border-t-2 border-white/60 z-[1000] flex items-center pb-safe">
            <div id="my-hand" class="flex gap-4 px-10 overflow-x-auto no-scrollbar items-center h-full w-full relative"></div>
        </div>

        <div id="action-panel" style="pointer-events: none;" class="fixed bottom-0 left-0 right-0 bg-white border-t-8 border-yellow-300 p-6 z-[3000] translate-y-full transition-transform duration-500 rounded-t-[4rem]">
            <div class="flex justify-between items-start mb-6">
                <div><h3 id="selected-card-name" class="text-3xl font-black text-slate-800 italic uppercase">CARD</h3><p id="selected-card-desc" class="text-[11px] text-slate-500 mt-1 font-bold"></p></div>
                <button onclick="deselectCard()" class="bg-slate-100 w-12 h-12 rounded-full flex items-center justify-center text-slate-400 font-bold text-xl">✕</button>
            </div>
            <div id="control-area">
                <button id="play-btn" onclick="executePlay()" class="w-full bg-gradient-to-r from-yellow-400 to-orange-500 text-white font-black py-5 rounded-[2.5rem] text-2xl shadow-xl uppercase italic">Play Card!</button>
            </div>
        </div>
    </div>

<script>
    // Firebase初期化（みもりちゃんのキーを使用）
    const firebaseConfig = { apiKey: "AIzaSyB0K9MQEuEYQghAUiLyjUWzqk32x9fznwY", authDomain: "pamimi-cbb93.firebaseapp.com", databaseURL: "https://pamimi-cbb93-default-rtdb.firebaseio.com", projectId: "pamimi-cbb93" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let myName = "", roomPath = "", gameState = null, selectedIdx = -1, lastCardID = "", isJoinedFlag = false, isSuspenseActive = false, lastProcessedVFX = "", isVFXRunning = false;

    // PWA Service Workerの登録
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    async function joinRoom() {
        const rI = document.getElementById('room-id').value.trim();
        const nI = document.getElementById('user-name').value.trim();
        if (!rI || !nI) return alert("名前と合言葉を入れてね！");
        myName = nI; roomPath = `panic100_frontier_v124/${rI}`;
        isJoinedFlag = true; render(); // 即座に描画許可
        
        try {
            const snap = await db.ref(roomPath).get();
            let d = snap.val();
            if (!d) d = { hostName: myName, players: [{ name: myName, hand: generateHand(7), hibernation: 0 }], started: false, total: 0, currentIndex: 0, direction: 1, lastPlayed: null, turnCount: 0, gameOver: false, suspense: null };
            else if (!d.players.find(p => p.name === myName)) {
                if (d.started) { alert("進行中！"); isJoinedFlag = false; render(); return; }
                d.players.push({ name: myName, hand: generateHand(7), hibernation: 0 });
            }
            await db.ref(roomPath).set(d);
            db.ref(roomPath).on('value', s => { gameState = s.val(); render(); });
        } catch (e) { isJoinedFlag = false; render(); }
    }

    function triggerVFX(symbol, animateClass = "", bgClass = "") {
        if (isVFXRunning) return Promise.resolve();
        isVFXRunning = true;
        const overlay = document.getElementById('vfx-overlay'); const item = document.getElementById('vfx-item');
        item.innerHTML = symbol; item.className = "vfx-content " + (animateClass || "");
        if(bgClass) { document.body.classList.add(bgClass); document.body.classList.add('vfx-active-bg'); }
        overlay.classList.add('vfx-active');
        return new Promise(res => setTimeout(() => {
            overlay.classList.remove('vfx-active');
            if(bgClass) { document.body.classList.remove(bgClass); document.body.classList.remove('vfx-active-bg'); }
            isVFXRunning = false; render(); res();
        }, 2200));
    }

    function makeCard() {
        const r = Math.random();
        if (r < 0.40) return { name: '+' + (Math.floor(Math.random()*20)+1), type: 'num' };
        if (r < 0.65) return { name: '-' + (Math.floor(Math.random()*20)+1), type: 'num' };
        if (r < 0.85) return { name: 'SKIP', type: 'skip', isEvent: true };
        return { name: 'BOMB', type: 'bomb', isRare: true };
    }
    function generateHand(c) { return Array.from({length: c}, () => makeCard()); }
    function shuffleArray(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    function render() {
        if (!isJoinedFlag) return;
        const isL = gameState ? (gameState.hostName === myName) : false;
        
        if (!gameState || !gameState.started) {
            document.getElementById('setup-screen').classList.remove('hidden');
            if (gameState) {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('lobby-box').classList.remove('hidden');
                document.getElementById('member-list').innerHTML = gameState.players.map(p => `<div class="p-4 bg-white rounded-2xl border-4 border-slate-100 font-black flex justify-between shadow-sm"><span>${p.name}</span>${p.name===gameState.hostName?'<span class="text-yellow-500">HOST</span>':''}</div>`).join('');
                document.getElementById('host-controls').classList.toggle('hidden', !isL);
                document.getElementById('guest-waiting').classList.toggle('hidden', isL);
            }
        } else {
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            // ... (演出・手札描画ロジックの詳細は以前のバージョンを維持しつつエラーガードを追加)
            const curP = gameState.players[gameState.currentIndex];
            document.getElementById('turn-announcer-horiz').innerText = `NOW: ${curP.name}'s TURN`;
            
            const myD = gameState.players.find(p => p.name === myName);
            if (myD && myD.hand) {
                document.getElementById('my-hand').innerHTML = myD.hand.map((c, i) => `
                    <div class="card-container"><button onclick="selectCard(${i})" class="card-base w-24 h-36 font-black bg-blue-500">${c.name}</button></div>
                `).join('');
            }
        }
    }

    function selectCard(i) {
        selectedIdx = i;
        document.getElementById('action-panel').style.pointerEvents = "auto";
        document.getElementById('action-panel').classList.remove('translate-y-full');
    }
    function deselectCard() {
        document.getElementById('action-panel').classList.add('translate-y-full');
        document.getElementById('action-panel').style.pointerEvents = "none";
    }
</script>
</body>
</html>
