<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ぱにっく100！DX</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { background: linear-gradient(135deg, #fff9c4 0%, #ffc1e3 50%, #b3e5fc 100%); color: #374151; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; font-family: 'Arial Black', sans-serif; touch-action: manipulation; margin: 0; transition: background 0.6s ease; padding-top: env(safe-area-inset-top); }
        #stadium-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .player-orbit { position: absolute; min-width: 90px; height: 45px; transition: all 0.5s; z-index: 50; display: flex; align-items: center; justify-content: center; }
        .orbit-arrow { position: absolute; font-size: 34px; color: #ea580c; transition: all 0.5s; z-index: 30; pointer-events: none; text-shadow: -1px -1px 0 white, 1px -1px 0 white, -1px 1px 0 white, 1px 1px 0 white, 2px 2px 5px rgba(0,0,0,0.4); }
        
        .card-container { position: relative; flex-shrink: 0; padding: 5px; }
        .card-base { border: 4px solid white; border-radius: 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; transition: all 0.2s ease-out; box-shadow: 0 6px 15px rgba(0,0,0,0.2); white-space: nowrap; color: white !important; font-size: 1.8rem; text-shadow: 2px 2px 0px rgba(0,0,0,0.3); overflow: hidden; cursor: pointer; }
        .card-active { transform: translateY(-30px) scale(1.15); border: 6px solid #fbbf24 !important; z-index: 1500; box-shadow: 0 30px 50px rgba(0,0,0,0.4); }
        
        /* 演出用カラー */
        body.vfx-active-bg { background-image: none !important; }
        .bg-vfx-brink { background-color: #ffdbbb !important; }
        .bg-vfx-bomb { background-color: #fca5a5 !important; }
        .bg-vfx-tanyao { background-color: #a7f3d0 !important; }
        .bg-vfx-bag { background-color: #fde68a !important; }
        .bg-vfx-sleep { background-color: #c7d2fe !important; }
        .bg-vfx-crazy { background-color: #fbcfe8 !important; }
        .bg-danger { background-color: #dc2626 !important; }

        /* 新着バッジ：可愛い赤丸 */
        .tab-red-dot { position: absolute; top: 0px; right: 0px; width: 12px; height: 12px; background-color: #ef4444; border: 2px solid white; border-radius: 50%; z-index: 10; animation: pulse 1s infinite; }
        .new-badge { position: absolute; top: -10px; right: -10px; background: #ef4444; color: white; font-size: 9px; padding: 2px 8px; border-radius: 20px; border: 2px solid white; z-index: 1600; font-weight: 900; animation: pulse 1s infinite; }
        
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        #vfx-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 5000; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; }
        .vfx-active { opacity: 1 !important; }
        .vfx-content { font-size: 8rem; filter: drop-shadow(0 0 40px rgba(0,0,0,0.5)); transform: scale(0); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* iPhone底面バー対策 */
        #action-panel { padding-bottom: calc(2rem + env(safe-area-inset-bottom)); }
        #hand-wrapper { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>

    <div id="vfx-overlay"><div id="vfx-item" class="vfx-content"></div></div>
    <audio id="se-play" src="https://actions.google.com/config/audio/g_regular_opening.mp3"></audio>
    <audio id="se-bomb" src="https://actions.google.com/config/audio/explosion.mp3"></audio>
    <audio id="bgm-battle" loop src="https://cdn.pixabay.com/audio/2022/03/10/audio_c33ca4523a.mp3"></audio>

    <div id="setup-screen" class="fixed inset-0 z-[3000] bg-gradient-to-br from-yellow-50 to-orange-100 flex items-center justify-center p-4">
        <div id="login-box" class="bg-white p-8 rounded-[3.5rem] border-8 border-yellow-300 w-full max-w-sm shadow-[0_20px_0_#fde047] text-center">
            <h1 class="text-4xl font-black text-yellow-500 mb-6 italic uppercase">ぱにっく100！</h1>
            <input id="room-id" type="text" placeholder="部屋の合言葉" class="w-full bg-yellow-50 p-4 rounded-2xl mb-4 border-4 border-yellow-200 text-center font-black outline-none focus:border-orange-400">
            <input id="user-name" type="text" placeholder="あなたの名前" class="w-full bg-yellow-50 p-4 rounded-2xl mb-8 border-4 border-yellow-200 text-center font-black outline-none focus:border-orange-400">
            <button onclick="joinRoom()" class="w-full bg-gradient-to-b from-orange-400 to-red-500 text-white font-black py-5 rounded-3xl shadow-xl active:translate-y-1 text-2xl uppercase italic">Entry!</button>
            <div id="conn-status" class="mt-6 text-[10px] text-orange-300 font-black uppercase">Ready</div>
        </div>
        <div id="lobby-box" class="hidden bg-white p-8 rounded-[4rem] border-8 border-blue-300 w-full max-w-sm text-center shadow-[0_20px_0_#93c5fd]">
            <h2 class="text-3xl font-black mb-6 text-blue-500 uppercase italic">Lobby</h2>
            <div id="member-list" class="space-y-3 max-h-64 overflow-y-auto no-scrollbar mb-8 text-left p-2"></div>
            <div id="host-controls" class="hidden"><button id="start-btn" onclick="startGame()" class="w-full bg-gradient-to-b from-blue-400 to-indigo-600 text-white font-black py-5 rounded-3xl shadow-lg text-2xl uppercase italic">Battle Start!</button></div>
            <div id="guest-waiting" class="text-blue-300 animate-pulse font-black uppercase text-sm">Connecting to Arena...</div>
        </div>
    </div>

    <div id="game-screen" class="hidden flex-1 flex flex-col relative h-full">
        <div class="pt-8 p-4 shrink-0 z-[100]">
            <button onclick="toggleRules()" class="fixed top-24 right-4 z-[150] bg-white w-12 h-12 rounded-full shadow-lg font-black text-pink-500 border-4 border-pink-100 text-xl active:scale-90">？</button>
            <div class="flex items-center justify-between px-2">
                <span id="total-display" class="text-4xl font-black text-blue-600 italic tracking-tighter">0 / 100</span>
                <div class="flex-1 ml-4 h-6 bg-white/60 rounded-full border-2 border-white p-1 overflow-hidden">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-cyan-400 to-blue-600 rounded-full transition-all duration-1000"></div>
                </div>
            </div>
        </div>

        <div id="battle-field" class="flex-1 relative overflow-hidden bg-white/5 min-h-0">
            <div id="stadium-container">
                <div id="player-ring" class="absolute inset-0 pointer-events-none"></div>
                <div id="field-card-container" class="z-10 flex flex-col items-center justify-center relative">
                    <div id="last-card"></div>
                    <div id="field-placeholder" class="text-slate-300 font-black tracking-[0.5em] opacity-30 italic text-xl">CENTER</div>
                </div>
            </div>
        </div>

        <div class="px-6 py-1 shrink-0 flex justify-center z-[110]">
            <div id="turn-announcer-horiz" class="text-[10px] font-black text-pink-600 bg-white/90 px-5 py-2 rounded-full border-2 border-pink-200 shadow-sm truncate max-w-full uppercase tracking-tighter"></div>
        </div>

        <div id="tab-container" class="px-4 flex mb-1 z-[110] border-2 border-slate-200 rounded-xl overflow-hidden bg-white shadow-sm">
            <button onclick="changeTab('all')" id="tab-all" class="flex-1 py-2 font-black text-[10px] border-r-2 border-slate-100 transition-all uppercase italic relative">ALL</button>
            <button onclick="changeTab('num')" id="tab-num" class="flex-1 py-2 font-black text-[10px] border-r-2 border-slate-100 transition-all uppercase italic relative">すうじ</button>
            <button onclick="changeTab('event')" id="tab-event" class="flex-1 py-2 font-black text-[10px] border-r-2 border-slate-100 transition-all uppercase italic relative">イベント</button>
            <button onclick="changeTab('rare')" id="tab-rare" class="flex-1 py-2 font-black text-[10px] transition-all uppercase italic relative">レア</button>
        </div>

        <div id="hand-wrapper" class="h-[180px] shrink-0 bg-white/40 border-t-2 border-white/60 z-[1000] flex items-center">
            <div id="my-hand" class="flex gap-4 px-10 overflow-x-auto no-scrollbar scroll-smooth items-center h-full w-full relative"></div>
        </div>

        <div id="action-panel" style="pointer-events: none;" class="fixed bottom-0 left-0 right-0 bg-white border-t-8 border-yellow-300 p-6 z-[3000] translate-y-full transition-transform duration-500 rounded-t-[4rem]">
            <div class="flex justify-between items-start mb-6">
                <div><h3 id="selected-card-name" class="text-3xl font-black text-slate-800 italic uppercase">CARD</h3><p id="selected-card-desc" class="text-[11px] text-slate-500 mt-1 font-bold"></p></div>
                <button onclick="deselectCard()" class="bg-slate-100 w-12 h-12 rounded-full flex items-center justify-center text-slate-400 font-bold text-xl">✕</button>
            </div>
            <div id="target-selector" class="hidden mb-6"><div id="target-list" class="flex gap-3 overflow-x-auto no-scrollbar py-2"></div></div>
            <div id="control-area">
                <button id="play-btn" onclick="executePlay()" class="w-full bg-gradient-to-r from-yellow-400 to-orange-500 text-white font-black py-5 rounded-[2.5rem] text-2xl shadow-xl active:scale-95 italic uppercase tracking-widest hidden">Play Card!</button>
                <div id="not-my-turn-msg" class="text-center text-slate-300 text-xs font-black py-6 border-4 border-dashed border-slate-100 rounded-[2.5rem] uppercase italic">Wait turn...</div>
            </div>
        </div>
    </div>

<script>
    // Firebase初期化（ミモリちゃんのキーを使用）
    const firebaseConfig = { apiKey: "AIzaSyB0K9MQEuEYQghAUiLyjUWzqk32x9fznwY", authDomain: "pamimi-cbb93.firebaseapp.com", databaseURL: "https://pamimi-cbb93-default-rtdb.firebaseio.com", projectId: "pamimi-cbb93" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let myName = "", roomPath = "", gameState = null, selectedIdxInFiltered = -1, lastCardID = "", targetName = "", currentTab = "all", isJoinedFlag = false, isSuspenseActive = false, lastProcessedVFX = "", lastProcessedSuspenseTurn = -1, isVFXRunning = false;
    const ICONS = { 'num': '', 'skip': '⏩', 'rev': '↺', 'draw2': '🃏🃏', 'calc': '🧮', 'brink': '⚡🔥', 'bomb': '💣🧨', 'bag': '💰👜', 'sleep': '💤🛌', 'crazy': '🚀💥', 'tanyao': '🀝' };
    const DESC = { 'num': '変化。', 'skip': '飛ばす！', 'rev': '逆転！', 'draw2': '2枚引く！', 'calc': '計算！', 'brink': '99固定！', 'bomb': '爆弾！', 'bag': '7枚引く！', 'sleep': '2回休み。', 'crazy': '3枚。', 'tanyao': '2-8以外ポイ！' };

    function toggleRules() { document.getElementById('rules-modal').classList.toggle('hidden'); }

    async function joinRoom() {
        const rI = document.getElementById('room-id').value.trim();
        const nI = document.getElementById('user-name').value.trim();
        if (!rI || !nI) return alert("名前と合言葉を入れてね！");
        myName = nI; roomPath = `panic100_final_v127/${rI}`;
        isJoinedFlag = true; render(); 
        try {
            const snap = await db.ref(roomPath).get();
            let d = snap.val();
            if (!d) d = { hostName: myName, players: [{ name: myName, hand: generateHand(7), hibernation: 0 }], started: false, total: 0, currentIndex: 0, direction: 1, lastPlayed: null, turnCount: 0, gameOver: false, suspense: null };
            else if (!d.players.find(p => p.name === myName)) {
                if (d.started) { alert("進行中！"); isJoinedFlag = false; render(); return; }
                d.players.push({ name: myName, hand: generateHand(7), hibernation: 0 });
            }
            await db.ref(roomPath).set(d);
            db.ref(roomPath).on('value', s => { gameState = s.val(); if(gameState) render(); });
        } catch (e) { isJoinedFlag = false; render(); }
    }

    function triggerVFX(symbol, animateClass = "", bgClass = "") {
        if (isVFXRunning) return Promise.resolve();
        isVFXRunning = true;
        const overlay = document.getElementById('vfx-overlay'); const item = document.getElementById('vfx-item');
        item.innerHTML = symbol; item.className = "vfx-content " + (animateClass || "");
        if(bgClass) { document.body.classList.add(bgClass); document.body.classList.add('vfx-active-bg'); }
        overlay.classList.add('vfx-active');
        return new Promise(res => setTimeout(() => {
            overlay.classList.remove('vfx-active');
            if(bgClass) { document.body.classList.remove(bgClass); document.body.classList.remove('vfx-active-bg'); }
            isVFXRunning = false; render(); res();
        }, 2200));
    }

    function makeCard(isNew = false) {
        const r = Math.random(); let card;
        if (r < 0.40) card = { name: '+' + (Math.floor(Math.random()*20)+1), type: 'num' };
        else if (r < 0.65) card = { name: '-' + (Math.floor(Math.random()*20)+1), type: 'num' };
        else if (r < 0.85) card = { name: 'SKIP', type: 'skip', isEvent: true };
        else card = { name: 'BOMB', type: 'bomb', isRare: true };
        if (isNew) { card.isNew = true; card.age = 0; } return card;
    }
    function generateHand(c) { return Array.from({length: c}, () => makeCard()); }
    function shuffleArray(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
    function changeTab(tab) { currentTab = tab; selectedIdxInFiltered = -1; render(); }
    function unlockAudio() { [document.getElementById('bgm-battle'), document.getElementById('se-play'), document.getElementById('se-bomb')].forEach(a => { if(a) { a.volume = 0.05; a.play().then(()=>a.pause()).catch(()=>{}); } }); }

    function filterHand(hand) {
        if (!hand) return [];
        return hand.map((c, i) => ({...c, originalIdx: i})).filter(c => {
            if (currentTab === 'num') return c.type === 'num' && !c.isEvent && !c.isRare;
            if (currentTab === 'event') return c.isEvent;
            if (currentTab === 'rare') return c.isRare;
            return true;
        }).sort((a, b) => (a.type === 'num' && b.type === 'num') ? parseInt(a.name) - parseInt(b.name) : a.type.localeCompare(b.type));
    }

    function selectCard(idx) {
        const myD = gameState.players.find(p => p.name === myName); 
        if(!myD || isSuspenseActive || isVFXRunning) return;
        selectedIdxInFiltered = idx; 
        const card = filterHand(myD.hand)[idx];
        document.getElementById('selected-card-name').innerText = card.name;
        document.getElementById('selected-card-desc').innerText = DESC[card.type] || 'CARD';
        document.getElementById('action-panel').style.pointerEvents = "auto";
        document.getElementById('action-panel').classList.remove('translate-y-full'); render();
    }
    function deselectCard() { selectedIdxInFiltered = -1; document.getElementById('action-panel').classList.add('translate-y-full'); document.getElementById('action-panel').style.pointerEvents = "none"; render(); }

    async function checkBombExplosion() {
        if (!gameState || isVFXRunning || isSuspenseActive) return; 
        const curP = gameState.players[gameState.currentIndex];
        if (curP.name === myName && lastProcessedSuspenseTurn !== gameState.turnCount && curP.hand.some(c => c.name === "BOMB")) {
            lastProcessedSuspenseTurn = gameState.turnCount;
            await db.ref(roomPath + "/suspense").set({ active: true, player: myName, turn: gameState.turnCount });
            isSuspenseActive = true; render();
            await triggerVFX('💣', 'bomb-pulsing', 'bg-vfx-bomb');
            if (Math.random() < 0.30) {
                await triggerVFX('OUT!', '', 'bg-danger');
                let updatedHand = curP.hand.map(c => (c.type === 'num') ? { ...c, name: "100", value: 100 } : c);
                await db.ref(roomPath + "/players/" + gameState.currentIndex + "/hand").set(updatedHand);
            } else { await triggerVFX('SAFE!', '', 'bg-vfx-sleep'); }
            await db.ref(roomPath + "/suspense").set(null);
            isSuspenseActive = false; render();
        }
    }

    function playCard(originalIdx) {
        const curP = gameState.players[gameState.currentIndex]; 
        const card = curP.hand.splice(originalIdx, 1)[0];
        let nT = gameState.total; if (card.type === 'num') nT += parseInt(card.name);
        gameState.players.forEach(p => { while(p.hand.length < 5) p.hand.push(makeCard(true)); });
        nT = Math.max(0, nT); if (nT >= 100) { db.ref(roomPath).update({ total: nT, gameOver: true, loser: myName, lastPlayed: { card, player: myName, id: Date.now() } }); return; }
        const nIdx = (gameState.currentIndex + gameState.direction + gameState.players.length) % gameState.players.length;
        db.ref(roomPath).update({ total: nT, currentIndex: nIdx, players: gameState.players, lastPlayed: { card, player: myName, id: Date.now() }, turnCount: gameState.turnCount + 1 });
    }

    function startGame() { 
        const sh = shuffleArray([...gameState.players]);
        db.ref(roomPath).update({ started: true, players: sh, currentIndex: 0, total: 0, gameOver: false, turnCount: 0 });
    }
    function executePlay() { 
        const curP = gameState.players[gameState.currentIndex]; 
        const card = filterHand(curP.hand)[selectedIdxInFiltered]; 
        playCard(card.originalIdx); deselectCard(); 
    }

    function render() {
        if (!isJoinedFlag) return;
        const isL = gameState ? (gameState.hostName === myName) : false;
        if (!gameState || !gameState.started) {
            document.getElementById('setup-screen').classList.remove('hidden'); document.getElementById('game-screen').classList.add('hidden');
            if (gameState) {
                document.getElementById('login-box').classList.add('hidden'); document.getElementById('lobby-box').classList.remove('hidden');
                document.getElementById('member-list').innerHTML = gameState.players.map(p => `<div class="p-4 bg-white rounded-2xl border-4 border-slate-100 font-black flex justify-between shadow-sm"><span>${p.name}</span>${p.name===gameState.hostName?'<span class="text-yellow-500">HOST</span>':''}</div>`).join('');
                document.getElementById('host-controls').classList.toggle('hidden', !isL);
            }
        } else {
            document.getElementById('setup-screen').classList.add('hidden'); document.getElementById('game-screen').classList.remove('hidden');
            const last = gameState.lastPlayed;
            if (last && lastProcessedVFX !== last.id && !isVFXRunning) { 
                lastProcessedVFX = last.id;
                if(last.card.isRare) triggerVFX('RARE!', '', 'bg-vfx-bomb');
                try { document.getElementById('se-play').play(); } catch(e){}
            }
            if(!isVFXRunning && !isSuspenseActive) checkBombExplosion();
            document.getElementById('total-display').innerText = `${gameState.total} / 100`;
            document.getElementById('progress-bar').style.width = `${Math.min(100, gameState.total)}%`;
            
            const myD = gameState.players.find(p => p.name === myName);
            if (myD && myD.hand) {
                ["all", "num", "event", "rare"].forEach(t => {
                    const el = document.getElementById(`tab-${t}`); el.style.backgroundColor = (t === currentTab) ? "#ec4899" : "white"; el.style.color = (t === currentTab) ? "white" : "#94a3b8";
                    const oldDot = el.querySelector('.tab-red-dot'); if(oldDot) oldDot.remove();
                    const hasNew = (t==='all') ? myD.hand.some(c=>c.isNew) : (t==='num') ? myD.hand.some(c=>c.isNew && c.type==='num') : (t==='event') ? myD.hand.some(c=>c.isNew && c.isEvent) : myD.hand.some(c=>c.isNew && c.isRare);
                    if (hasNew) { const dot = document.createElement('div'); dot.className = 'tab-red-dot'; el.appendChild(dot); }
                });
                document.getElementById('my-hand').innerHTML = filterHand(myD.hand).map((c, i) => `<div class="card-container"><button onclick="selectCard(${i})" class="card-base w-24 h-36 font-black bg-blue-500 ${selectedIdxInFiltered===i?'card-active':''}">${c.name}</button>${c.isNew ? '<span class="new-badge">New</span>' : ''}</div>`).join('');
            }
            const ring = document.getElementById('player-ring');
            ring.innerHTML = gameState.players.map((p, i) => {
                const ang = (i * (360 / gameState.players.length) - 90) * (Math.PI / 180);
                const x = 150 + 100 * Math.cos(ang) - 45; const y = 150 + 100 * Math.sin(ang) - 22;
                return `<div class="player-orbit" style="left: ${x}px; top: ${y}px;"><div class="w-full h-full rounded-2xl flex items-center justify-center font-black border-4 ${i===gameState.currentIndex ? 'border-yellow-400 bg-white shadow-lg' : 'border-slate-300 bg-white/80'}"><span>${p.name}</span></div></div>`;
            }).join('');
        }
    }
</script>
</body>
</html>
